  p.sub{font-size:13px;color:#8E8E93;margin-top:2px}

  .barra i{display:block;height:100%;width:0;background:#F5503C;transition:width .2s}
  .stato{font-size:12px;color:#8E8E93;margin-top:6px;font-variant-numeric:tabular-nums}

  .legenda b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
  .lista{padding:8px 0 40px}
  .riga{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid #F2F2F1}

  .riga .c{font:11px/1.4 'SF Mono',Menlo,monospace;color:#8E8E93;margin-top:2px}
  .azioni{padding:16px 14px 40px}
  button{width:100%;padding:14px;border:none;border-radius:14px;background:#F5503C;color:#fff;
         font:600 15px inherit;font-family:inherit;margin-bottom:8px}
  button.sec{background:#fff;color:#1C1C1E;border:1px solid #EAEAE8}
  textarea{width:100%;height:180px;margin-top:10px;padding:10px;border:1px solid #EAEAE8;

var map = L.map('map').setView([36.2, 137.5], 5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd', maxZoom:19
}).addTo(map);

var COL = { ok:'#4CAF6C', fb:'#E7A94F', warn:'#F5503C' };
var gruppo = L.layerGroup().addTo(map);

function pin(lat, lon, n, colore, testo){
  var m = L.circleMarker([lat,lon], {radius:9, color:'#fff', weight:2,
          fillColor:colore, fillOpacity:1}).addTo(gruppo);
  m.bindPopup('<b>'+n+'.</b> '+testo);
  return m;
}

function disegna(){
  gruppo.clearLayers();
  var punti = [];
  STOPS.forEach(function(s, i){
    if (!s.lat) return;
    pin(s.lat, s.lon, i+1, COL[s.src] || COL.warn, s.title);
    punti.push([s.lat, s.lon]);
  });
  if (punti.length) map.fitBounds(punti, {padding:[30,30]});
  lista();
  document.getElementById('out').value = JSON.stringify(
    STOPS.map(function(s){ return {id:s.id, lat:s.lat, lon:s.lon, src:s.src}; }));
}

function lista(){
  var c = document.getElementById('lista');
  c.innerHTML = '';
  STOPS.forEach(function(s, i){
    var d = document.createElement('div');
    d.className = 'riga';
    var col = COL[s.src] || '#C7C7CC';
    d.innerHTML =
      '<div class="n" style="background:'+col+'">'+(i+1)+'</div>' +
      '<div class="txt"><div class="t">'+s.title+'</div>' +
      '<div class="q">'+s.q+'</div>' +
      '<div class="c">'+(s.lat ? s.lat.toFixed(5)+', '+s.lon.toFixed(5) +
        (s.src==='fb' ? '  (di riserva)' : '') : '—')+'</div></div>';
    d.onclick = function(){
      if (s.lat) { map.setView([s.lat, s.lon], 15); window.scrollTo({top:0, behavior:'smooth'}); }
    };
    c.appendChild(d);
  });
}

function dist(a, b, c, d){ // km, approssimata
  var dx = (a-c)*111, dy = (b-d)*111*Math.cos(a*Math.PI/180);
  return Math.sqrt(dx*dx + dy*dy);
}

document.getElementById('vai').onclick = function(){
  var btn = this; btn.disabled = true; btn.textContent = 'cerco…';
  var i = 0;
  function passo(){
    if (i >= STOPS.length){
      btn.textContent = 'Fatto'; document.getElementById('stato').textContent =
        'finito — controlla la mappa'; disegna(); return;
    }
    var s = STOPS[i];
    document.getElementById('stato').textContent = (i+1)+' / '+STOPS.length+'  ·  '+s.q;
    document.getElementById('prog').style.width = ((i+1)/STOPS.length*100)+'%';
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' +
          encodeURIComponent(s.q))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j && j.length){
          s.lat = parseFloat(j[0].lat); s.lon = parseFloat(j[0].lon); s.src = 'ok';
          // se si discosta molto dalla mia stima, va guardata
          if (s.fb && dist(s.lat, s.lon, s.fb[0], s.fb[1]) > 3) s.src = 'warn';
        } else if (s.fb){ s.lat = s.fb[0]; s.lon = s.fb[1]; s.src = 'fb'; }
      })
      .catch(function(){ if (s.fb){ s.lat = s.fb[0]; s.lon = s.fb[1]; s.src = 'fb'; } })
      .then(function(){ i++; disegna(); setTimeout(passo, 1100); });
  }
  passo();
};

document.getElementById('copia').onclick = function(){
  var t = document.getElementById('out'); t.select();
  try { document.execCommand('copy'); this.textContent = 'copiato'; } catch(e){}
};

// all'avvio mostro subito le coordinate di riserva, così la mappa non è vuota
STOPS.forEach(function(s){ if (s.fb){ s.lat = s.fb[0]; s.lon = s.fb[1]; s.src = 'fb'; } });
disegna();
